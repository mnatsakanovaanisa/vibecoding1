<!DOCTYPE html>
<html lang="ru">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

<style>
:root{
  --fcc-primary:#0a0c23;
  --fcc-secondary:#1e1f3b;
  --fcc-accent:#99c9ff;
  --fcc-green:#2f7d32;
  --fcc-green-light:#3ea442;
  --fcc-yellow:#f1be32;
  --fcc-gray:#a9a9b3;
  --fcc-text:#0a0c23;
  --fcc-bg:#ffffff;
  --fcc-card:#f0f4f8;
  --fcc-border:#d7d9e2;
  --fcc-sidebar:#ffffff;
  --fcc-code-bg:#0a0c23;
  --fcc-shadow:0 4px 12px rgba(0,0,0,.08);
  --radius:6px;
}
[data-theme="dark"]{
  --fcc-primary:#0a0c23;
  --fcc-secondary:#1e1f3b;
  --fcc-text:#e8e8ec;
  --fcc-bg:#0a0c23;
  --fcc-card:#16182d;
  --fcc-border:#2a2c4a;
  --fcc-sidebar:#13152a;
  --fcc-code-bg:#0a0c23;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--fcc-bg);
  color:var(--fcc-text);
  display:flex;
  flex-direction:column;
  transition:background .2s,color .2s;
}
/* ===== TOPBAR ===== */
.topbar{
  display:flex;
  align-items:center;
  height:56px;
  padding:0 16px;
  background:var(--fcc-primary);
  color:#fff;
  position:sticky;top:0;z-index:100;
  box-shadow:var(--fcc-shadow);
  gap:16px;
}
.topbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;cursor:pointer;white-space:nowrap}
.topbar .logo i{color:#fff;font-size:22px}
.topbar .logo .cc{color:var(--fcc-green-light)}
.topbar nav{display:flex;gap:4px;flex:1;align-items:center}
.topbar nav a{
  color:#cbd1d8;padding:8px 12px;border-radius:4px;font-size:14px;cursor:pointer;text-decoration:none;
}
.topbar nav a:hover{background:rgba(255,255,255,.1)}
.topbar .actions{display:flex;align-items:center;gap:10px}
.topbar .progress-mini{font-size:13px;color:#cbd1d8;white-space:nowrap}
.topbar .progress-mini b{color:var(--fcc-green-light)}
.theme-btn{
  background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.theme-btn:hover{background:rgba(255,255,255,.15)}
.menu-btn{display:none;background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer}

/* ===== LAYOUT ===== */
.layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 56px)}
.sidebar{
  width:340px;min-width:340px;background:var(--fcc-sidebar);
  border-right:1px solid var(--fcc-border);overflow-y:auto;padding:12px 0;
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--fcc-border);border-radius:4px}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:8px}
.main::-webkit-scrollbar-thumb{background:var(--fcc-border);border-radius:4px}

/* ===== SIDEBAR ===== */
.sb-header{padding:8px 16px 12px;font-size:12px;font-weight:700;color:var(--fcc-gray);text-transform:uppercase;letter-spacing:.5px}
.sb-search{margin:0 12px 8px;position:relative}
.sb-search input{
  width:100%;padding:8px 10px 8px 32px;border:1px solid var(--fcc-border);
  border-radius:4px;background:var(--fcc-bg);color:var(--fcc-text);font-size:13px;
}
.sb-search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fcc-gray);font-size:13px}
.module{border-bottom:1px solid var(--fcc-border)}
.module-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:14px;font-weight:600;
}
.module-head:hover{background:var(--fcc-card)}
.module-head .chev{margin-left:auto;transition:transform .2s;color:var(--fcc-gray)}
.module.open .module-head .chev{transform:rotate(90deg)}
.module-head .micon{
  width:28px;height:28px;border-radius:50%;background:var(--fcc-green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;
}
.module.completed .module-head .micon{background:var(--fcc-green-light)}
.module-head .mtitle{flex:1}
.module-head .mcount{font-size:11px;color:var(--fcc-gray);font-weight:400}
.module-body{display:none;padding:0 0 8px}
.module.open .module-body{display:block}
.lesson-item{
  display:flex;align-items:center;gap:10px;padding:7px 16px 7px 44px;cursor:pointer;font-size:13px;
}
.lesson-item:hover{background:var(--fcc-card)}
.lesson-item.active{background:rgba(47,125,50,.12);border-left:3px solid var(--fcc-green);padding-left:41px;font-weight:600}
.lesson-item .licon{width:18px;text-align:center;font-size:13px;flex-shrink:0}
.lesson-item .licon.done{color:var(--fcc-green)}
.lesson-item .licon.todo{color:var(--fcc-gray)}
.lesson-item .ltitle{flex:1;color:var(--fcc-text)}
.lesson-item.locked .ltitle{color:var(--fcc-gray);opacity:.6}

/* ===== CONTENT ===== */
.content{padding:24px 32px;max-width:1400px;margin:0 auto;width:100%}
.crumbs{font-size:13px;color:var(--fcc-gray);margin-bottom:8px}
.crumbs b{color:var(--fcc-text)}
.lesson-title{font-size:26px;font-weight:800;margin-bottom:4px;color:var(--fcc-primary)}
[data-theme="dark"] .lesson-title{color:#fff}
.lesson-sub{color:var(--fcc-gray);font-size:14px;margin-bottom:20px}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--fcc-border);margin-bottom:20px}
.tab{
  padding:10px 18px;cursor:pointer;font-size:14px;font-weight:600;color:var(--fcc-gray);
  border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;
}
.tab:hover{color:var(--fcc-text)}
.tab.active{color:var(--fcc-green);border-bottom-color:var(--fcc-green)}
.tab .badge{font-size:11px;margin-left:6px;color:var(--fcc-gray)}

/* Lesson panels */
.panel{display:none}
.panel.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.theory{font-size:15px;line-height:1.75;color:var(--fcc-text)}
.theory h3{font-size:19px;margin:22px 0 10px;color:var(--fcc-primary)}
[data-theme="dark"] .theory h3{color:#fff}
.theory p{margin-bottom:12px}
.theory ul,.theory ol{margin:8px 0 12px 22px}
.theory li{margin-bottom:6px}
.theory code{
  background:var(--fcc-card);padding:2px 6px;border-radius:3px;font-size:13px;
  font-family:"SF Mono",Consolas,Monaco,monospace;color:var(--fcc-primary);
}
[data-theme="dark"] .theory code{color:#ffd0a9;background:#2a2c4a}
.theory pre{
  background:var(--fcc-code-bg);color:#e8e8ec;padding:14px 16px;border-radius:6px;
  overflow-x:auto;margin:12px 0;font-size:13px;line-height:1.5;
  font-family:"SF Mono",Consolas,Monaco,monospace;
}
.theory pre code{background:none;color:inherit;padding:0;font-size:13px}
.theory .note{
  border-left:4px solid var(--fcc-yellow);background:rgba(241,190,50,.1);
  padding:12px 16px;margin:16px 0;border-radius:0 4px 4px 0;font-size:14px;
}
.theory .tip{
  border-left:4px solid var(--fcc-green);background:rgba(47,125,50,.08);
  padding:12px 16px;margin:16px 0;border-radius:0 4px 4px 0;font-size:14px;
}

/* Challenge / IDE */
.ide{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
}
.ide-left,.ide-right{display:flex;flex-direction:column;gap:12px}
.challenge-card{
  background:var(--fcc-card);border:1px solid var(--fcc-border);border-radius:8px;padding:18px;
}
.challenge-card h4{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.challenge-card h4 i{color:var(--fcc-green)}
.task-list{list-style:none;margin:0}
.task-list li{padding:6px 0 6px 26px;position:relative;font-size:14px}
.task-list li:before{
  content:"\f096";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;left:0;
  color:var(--fcc-gray);
}
.task-list li.pass:before{content:"\f14a";color:var(--fcc-green)}
.task-list li.fail:before{content:"\f06a";color:#d93025}

.editor-wrap{border:1px solid var(--fcc-border);border-radius:6px;overflow:hidden}
.editor-toolbar{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--fcc-primary);color:#fff;font-size:12px;
}
.editor-toolbar .dots{display:flex;gap:5px}
.editor-toolbar .dot{width:11px;height:11px;border-radius:50%}
.editor-toolbar .dot.r{background:#ff5f56}.editor-toolbar .dot.y{background:#ffbd2e}.editor-toolbar .dot.g{background:#27c93f}
.editor-toolbar .fname{margin-left:8px;font-family:monospace}
.CodeMirror{height:380px !important;font-size:14px !important;font-family:"SF Mono",Consolas,Monaco,monospace !important}
.console-wrap{border:1px solid var(--fcc-border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.console-head{background:var(--fcc-secondary);color:#fff;padding:8px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.console-head .clear-btn{background:transparent;border:none;color:#cbd1d8;cursor:pointer;font-size:12px}
.console-head .clear-btn:hover{color:#fff}
.console-body{background:#0a0c23;color:#e8e8ec;padding:12px;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13px;line-height:1.6;height:280px;overflow-y:auto;white-space:pre-wrap}
.console-body .err{color:#ff8b8b}
.console-body .ok{color:#7ee787}
.console-body .info{color:#99c9ff}
.console-body .out{color:#e8e8ec}

.ide-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  padding:9px 18px;border-radius:4px;border:none;cursor:pointer;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;transition:.15s;
}
.btn-run{background:var(--fcc-primary);color:#fff}
.btn-run:hover{background:var(--fcc-secondary)}
.btn-test{background:var(--fcc-green);color:#fff}
.btn-test:hover{background:var(--fcc-green-light)}
.btn-hint{background:transparent;color:var(--fcc-primary);border:1px solid var(--fcc-border)}
[data-theme="dark"] .btn-hint{color:#fff}
.btn-sol{background:transparent;color:var(--fcc-gray);border:1px solid var(--fcc-border)}
.btn-next{background:var(--fcc-yellow);color:#0a0c23}
.btn:disabled{opacity:.5;cursor:not-allowed}

.hint-box{display:none;background:rgba(241,190,50,.1);border:1px solid var(--fcc-yellow);border-radius:6px;padding:12px 14px;font-size:13px;margin-top:10px}
.hint-box.show{display:block}

/* Solution reveal */
.solution-box{display:none;background:var(--fcc-card);border:1px dashed var(--fcc-border);border-radius:6px;padding:12px 14px;font-size:13px;margin-top:10px;font-family:monospace;white-space:pre-wrap}
.solution-box.show{display:block}

/* Bottom nav */
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--fcc-border)}
.lesson-nav button{background:transparent;border:1px solid var(--fcc-border);color:var(--fcc-text);padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px}
.lesson-nav button:hover{background:var(--fcc-card)}
.lesson-nav button:disabled{opacity:.4;cursor:not-allowed}

/* Welcome / Dashboard */
.dashboard{padding:32px;max-width:1100px;margin:0 auto}
.hero{
  background:linear-gradient(135deg,var(--fcc-primary),var(--fcc-secondary));
  color:#fff;border-radius:12px;padding:36px;margin-bottom:24px;
}
.hero h1{font-size:30px;margin-bottom:10px}
.hero p{font-size:15px;color:#cbd1d8;max-width:600px;line-height:1.6}
.hero .stats{display:flex;gap:28px;margin-top:20px}
.hero .stat b{font-size:26px;color:var(--fcc-green-light)}
.hero .stat span{display:block;font-size:12px;color:#a9a9b3}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mod-card{
  background:var(--fcc-card);border:1px solid var(--fcc-border);border-radius:10px;padding:18px;cursor:pointer;transition:.2s;
}
.mod-card:hover{transform:translateY(-2px);box-shadow:var(--fcc-shadow);border-color:var(--fcc-green)}
.mod-card .mnum{
  width:40px;height:40px;border-radius:50%;background:var(--fcc-green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:12px;
}
.mod-card.completed .mnum{background:var(--fcc-green-light)}
.mod-card h3{font-size:16px;margin-bottom:6px}
.mod-card p{font-size:13px;color:var(--fcc-gray);line-height:1.5;margin-bottom:10px}
.mod-card .pbar{height:6px;background:var(--fcc-border);border-radius:3px;overflow:hidden}
.mod-card .pbar-fill{height:100%;background:var(--fcc-green);transition:width .4s}
.mod-card .pmeta{font-size:11px;color:var(--fcc-gray);margin-top:6px;display:flex;justify-content:space-between}

/* Certificate */
.certificate-banner{
  display:none;background:linear-gradient(135deg,#2f7d32,#3ea442);color:#fff;
  border-radius:10px;padding:24px;margin-bottom:20px;align-items:center;gap:16px;
}
.certificate-banner.show{display:flex}
.certificate-banner i{font-size:36px}
.certificate-banner h3{font-size:18px;margin-bottom:4px}
.certificate-banner p{font-size:13px;opacity:.9}

/* Loading overlay */
.loader-overlay{
  position:fixed;inset:0;background:rgba(10,12,35,.85);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
}
.loader-overlay .spinner{font-size:42px;color:var(--fcc-green-light);animation:spin 1s linear infinite;margin-bottom:18px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-overlay h3{font-size:18px;margin-bottom:6px}
.loader-overlay p{font-size:13px;color:#cbd1d8}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--fcc-primary);color:#fff;
  padding:14px 20px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);
  z-index:9998;font-size:14px;display:flex;align-items:center;gap:10px;
  transform:translateY(80px);opacity:0;transition:.3s;
}
.toast.show{transform:none;opacity:1}
.toast.success{border-left:4px solid var(--fcc-green-light)}
.toast.error{border-left:4px solid #ff5f56}

/* Responsive */
@media(max-width:900px){
  .ide{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-340px;top:56px;height:calc(100vh - 56px);z-index:200;transition:left .25s}
  .sidebar.open{left:0}
  .menu-btn{display:block}
  .content{padding:16px}
  .topbar nav{display:none}
}
</style>
</head>
<body data-theme="light">

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="spinner"><i class="fas fa-circle-notch"></i></div>
  <h3>Загрузка Python...</h3>
  <p id="loaderMsg">Инициализируем среду выполнения</p>
</div>

<!-- TOPBAR -->
<header class="topbar">
  <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
  <div class="logo" onclick="goDashboard()">
    <i class="fab fa-free-code-camp"></i>
    <span><span class="cc">free</span>CodeCamp</span>
    <span style="opacity:.6;font-size:13px;margin-left:4px">| Python</span>
  </div>
  <nav>
    <a onclick="goDashboard()"><i class="fas fa-th-large"></i> Курсы</a>
    <a onclick="goCurriculum()"><i class="fas fa-book"></i> Программа</a>
    <a onclick="goProgress()"><i class="fas fa-chart-line"></i> Прогресс</a>
  </nav>
  <div class="actions">
    <div class="progress-mini">Прогресс: <b id="topProgress">0%</b></div>
    <button class="theme-btn" id="themeBtn" title="Сменить тему"><i class="fas fa-moon"></i></button>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">Программа курса</div>
    <div class="sb-search">
      <i class="fas fa-search"></i>
      <input type="text" id="sbSearch" placeholder="Поиск уроков...">
    </div>
    <div id="curriculumList"></div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main">
    <!-- Dashboard / Lesson view injected here -->
  </main>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
/* ============================================================
   CURRICULUM DATA — Полный курс Python
   ============================================================ */
const CURRICULUM = [
  {
    id:"m1", icon:"1", title:"Основы Python", desc:"Вывод, переменные, типы данных, операторы",
    lessons:[
      {
        id:"m1l1", title:"Привет, мир!",
        theory:`<h3>Первый вывод на экран</h3>
<p>Функция <code>print()</code> — самый первый инструмент Python-разработчика. Она выводит данные в стандартный поток вывода (обычно — консоль). В Python 3 <code>print</code> является функцией, поэтому аргументы всегда заключаются в скобки.</p>
<pre><code>print("Привет, мир!")
print('Python — это просто')</code></pre>
<p>Можно передавать несколько аргументов через запятую — они будут выведены через пробел:</p>
<pre><code>print("Меня зовут", "Анна", "мне", 25)</code></pre>
<div class="note"><b>Важно:</b> текст (строки) всегда заключается в кавычки — одинарные <code>'</code> или двойные <code>"</code>. Числа можно писать без кавычек.</div>
<h3>Несколько строк вывода</h3>
<p>Каждый вызов <code>print()</code> автоматически добавляет перенос строки. Чтобы выводить в одну строку, используйте параметр <code>end</code>:</p>
<pre><code>print("Строка 1", end=" ")
print("Строка 2")  # будет в той же строке</code></pre>
<div class="tip"><b>Совет:</b> символ <code>#</code> начинает однострочный комментарий — Python игнорирует всё после него до конца строки.</div>`,
        starter:`# Напишите код ниже
print("Привет, мир!")`,
        hint:"Используйте print() и передайте строку в кавычках.",
        solution:`print("Привет, мир!")`,
        tasks:[
          {test:()=>"Привет, мир!"===captureOutput(`print("Привет, мир!")`), label:'Вывести "Привет, мир!"'}
        ]
      },
      {
        id:"m1l2", title:"Переменные",
        theory:`<h3>Что такое переменные</h3>
<p>Переменная — это именованная ячейка памяти, в которой хранится значение. В Python переменная создаётся в момент присваивания с помощью знака <code>=</code>:</p>
<pre><code>name = "Анна"
age = 25
height = 1.68
is_student = True</code></pre>
<p>Тип переменной определяется автоматически в зависимости от присвоенного значения. Чтобы узнать тип, используйте функцию <code>type()</code>:</p>
<pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;</code></pre>
<h3>Правила именования</h3>
<ul>
<li>Имя может содержать буквы, цифры и подчёркивание <code>_</code></li>

<h3>self — что это?</h3>
<p><code>self</code> — это ссылка на текущий объект. Через <code>self</code> метод обращается к атрибутам и другим методам этого же объекта. При вызове <code>rex.bark()</code> Python автоматически передаёт <code>rex</code> как <code>self</code>.</p>

<pre><code>class Animal:
    def __init__(self, name):

<pre><code>class BankAccount:

<h3>Свойства — @property</h3>
<pre><code>class Temperature:

<h3>Иерархия исключений</h3>

<li><code>KeyError</code> — ключ словаря не найден</li>
<li><code>FileNotFoundError</code> — файл не найден</li>
<li><code>AttributeError</code> — нет такого атрибута</li>

<h3>Свой контекстный менеджер — класс</h3>
<pre><code>class Timer:
    def __enter__(self):
        import time
        self.start = time.time()
        return self

    def __exit__(self, exc_type, exc_val, exc_tb):
        import time
        self.elapsed = time.time() - self.start
        print(f"Время: {self.elapsed:.4f} сек")
        return False  # не подавляем исключения

with Timer():
    sum(range(1000000))
# Время: 0.0521 сек</code></pre>

const STORAGE_KEY = "fcc_python_progress_v1";
let state = {
  completed: {},      // {lessonId: true}
  current: null,      // current lesson id
  theme: "light"
};
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
    state = Object.assign(state, s);
  }catch(e){}
  if(!state.completed) state.completed = {};
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function isLessonDone(id){ return !!state.completed[id]; }
function markDone(id){ state.completed[id]=true; saveState(); updateProgress(); }
function totalLessons(){ return CURRICULUM.reduce((n,m)=>n+m.lessons.length,0); }
function doneLessons(){ return Object.keys(state.completed).filter(k=>state.completed[k]).length; }
function updateProgress(){
  const p = Math.round(doneLessons()/totalLessons()*100);
  document.getElementById('topProgress').textContent = p+'%';
}

/* ============================================================
   HELPERS
   ============================================================ */
function flatLessons(){
  const arr=[];
  CURRICULUM.forEach(m=>m.lessons.forEach(l=>arr.push({mod:m,lesson:l})));
  return arr;
}
function findLesson(id){
  for(const m of CURRICULUM){
    const l = m.lessons.find(x=>x.id===id);
    if(l) return {mod:m,lesson:l};
  }
  return null;
}
function getAdjacent(id){
  const flat = flatLessons();
  const idx = flat.findIndex(x=>x.lesson.id===id);
  return {
    prev: idx>0 ? flat[idx-1] : null,
    next: idx<flat.length-1 ? flat[idx+1] : null
  };
}

/* ============================================================
   PYODIDE
   ============================================================ */
let pyodide = null;
let pyodideReady = false;

async function initPyodide(){
  document.getElementById('loaderMsg').textContent = "Загружаем Pyodide...";
  try{
    pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
    });
    pyodideReady = true;
    document.getElementById('loader').style.display='none';
    showToast("Python готов к работе! 🐍","success");
  }catch(e){
    document.getElementById('loaderMsg').textContent = "Ошибка загрузки: "+e.message;
    console.error(e);
  }
}

// Capture stdout from Python
let _capturedOutput = "";
function setupStdoutCapture(){
  pyodide.runPython(`
import sys, io
class _CaptureStream:
    def __init__(self):
        self.buffer = ""
    def write(self, s):
        self.buffer += s
    def flush(self):
        pass
_capture = _CaptureStream()
sys.stdout = _capture
sys.stderr = _capture
def _get_output():
    out = _capture.buffer
    _capture.buffer = ""
    return out
`);
}
function getPyOutput(){
  return pyodide.runPython("_get_output()");
}
function resetPyOutput(){
  pyodide.runPython("_capture.buffer = ''");
}

// Run user code and capture output
async function runUserCode(code){
  if(!pyodideReady){ showToast("Python ещё загружается...","error"); return; }
  resetPyOutput();
  try{
    pyodide.runPython(code);
    return {output: getPyOutput(), error: null};
  }catch(e){
    return {output: getPyOutput(), error: e.message};
  }
}

// Run code silently (for tests)
async function runSilent(code){
  if(!pyodideReady) return {output:"",error:"not ready"};
  resetPyOutput();
  try{
    pyodide.runPython(code);
    return {output: getPyOutput(), error: null};
  }catch(e){
    return {output: getPyOutput(), error: e.message};
  }
}

/* ============================================================
   CODE EXECUTION HELPERS FOR TASKS
   ============================================================ */
// These are sync wrappers used in task tests.
// They run code in pyodide and check output.
let _taskOutputs = {};
async function precomputeTaskOutputs(userCode, lesson){
  _taskOutputs = {};
  if(!lesson.tasks) return;
  // Run the user code once and capture output
  const r = await runSilent(userCode);
  _taskOutputs.userOutput = r.output;
  _taskOutputs.userError = r.error;
}

// captureOutputHas — checks if user output contains substring
function captureOutputHas(sub){
  return (_taskOutputs.userOutput||"").includes(sub);
}
function captureOutput(exact){
  return (_taskOutputs.userOutput||"").trim();
}
function runCheck(varname, type){
  // Try to get type of variable in pyodide
  try{
    const t = pyodide.runPython(`type(${varname}).__name__`);
    return t === type;
  }catch(e){
    return false;
  }
}

/* ============================================================
   UI: SIDEBAR
   ============================================================ */
function renderSidebar(filter=""){
  const container = document.getElementById('curriculumList');
  container.innerHTML = "";
  CURRICULUM.forEach((m,mi)=>{
    const doneCount = m.lessons.filter(l=>isLessonDone(l.id)).length;
    const allDone = doneCount===m.lessons.length;
    const div = document.createElement('div');
    div.className = 'module'+(state.current&&findLesson(state.current)&&findLesson(state.current).mod.id===m.id?' open':'')+(allDone?' completed':'');
    div.innerHTML = `
      <div class="module-head" onclick="toggleModule(this)">
        <div class="micon">${allDone?'<i class="fas fa-check"></i>':m.icon}</div>
        <div class="mtitle">${m.title}</div>
        <div class="mcount">${doneCount}/${m.lessons.length}</div>
        <i class="fas fa-chevron-right chev"></i>
      </div>
      <div class="module-body"></div>
    `;
    const body = div.querySelector('.module-body');
    m.lessons.forEach(l=>{
      if(filter && !l.title.toLowerCase().includes(filter.toLowerCase())) return;
      const done = isLessonDone(l.id);
      const active = state.current===l.id;
      const item = document.createElement('div');
      item.className = 'lesson-item'+(active?' active':'');
      item.onclick = ()=>openLesson(l.id);
      item.innerHTML = `
        <div class="licon ${done?'done':'todo'}">
          <i class="fas ${done?'fa-check-circle':'fa-circle-dot'}"></i>
        </div>
        <div class="ltitle">${l.title}</div>
      `;
      body.appendChild(item);
    });
    container.appendChild(div);
  });
}
function toggleModule(headEl){
  headEl.parentElement.classList.toggle('open');
}

   UI: DASHBOARD
   ============================================================ */

  let cardsHtml = "";
  CURRICULUM.forEach((m,i)=>{
    const doneCount = m.lessons.filter(l=>isLessonDone(l.id)).length;
    const pct = Math.round(doneCount/m.lessons.length*100);
    const allModDone = doneCount===m.lessons.length;
    cardsHtml += `
      <div class="mod-card ${allModDone?'completed':''}" onclick="openModule('${m.id}')">
        <div class="mnum">${allModDone?'<i class="fas fa-check"></i>':m.icon}</div>
        <h3>${m.title}</h3>
        <p>${m.desc}</p>
        <div class="pbar"><div class="pbar-fill" style="width:${pct}%"></div></div>
        <div class="pmeta"><span>${doneCount}/${m.lessons.length} уроков</span><span>${pct}%</span></div>
      </div>
    `;
  });
  main.innerHTML = `
    <div class="dashboard">
      <div class="certificate-banner ${allDone?'show':''}">
        <i class="fas fa-medal"></i>
        <div>
          <h3>Поздравляем! Вы прошли весь курс! 🎉</h3>
          <p>Все ${totalLessons()} уроков завершены. Вы можете скачать сертификат.</p>
        </div>
        <button class="btn btn-next" onclick="downloadCertificate()"><i class="fas fa-download"></i> Сертификат</button>
      </div>
      <div class="hero">
        <h1><i class="fab fa-python" style="color:#ffd43b"></i> Полный курс Python</h1>
        <p>10 модулей, ${totalLessons()} интерактивных уроков, реальные задания с проверкой кода прямо в браузере. Выполняйте задания, отслеживайте прогресс и получите сертификат.</p>
        <div class="stats">
          <div class="stat"><b>${totalLessons()}</b><span>Уроков</span></div>
          <div class="stat"><b>${doneLessons()}</b><span>Пройдено</span></div>
          <div class="stat"><b>${p}%</b><span>Прогресс</span></div>

function openModule(mid){
  const m = CURRICULUM.find(x=>x.id===mid);
  if(!m) return;
  // Open first not-done lesson or first
  const first = m.lessons.find(l=>!isLessonDone(l.id)) || m.lessons[0];
  openLesson(first.id);
}

/* ============================================================
   UI: LESSON VIEW
   ============================================================ */
let editor = null;
let currentLessonCtx = null;

function openLesson(lessonId){
  state.current = lessonId;
  saveState();
  const ctx = findLesson(lessonId);
  if(!ctx) return;
  currentLessonCtx = ctx;
  const {mod,lesson} = ctx;
  renderSidebar();
  renderLessonView(ctx);
}

function renderLessonView(ctx){
  const {mod,lesson} = ctx;
  const main = document.getElementById('main');
  main.scrollTop = 0;
  const adj = getAdjacent(lesson.id);
  const done = isLessonDone(lesson.id);
  main.innerHTML = `
    <div class="content">
      <div class="crumbs">Модуль ${mod.icon}: <b>${mod.title}</b> › ${lesson.title}</div>
      <h1 class="lesson-title">${lesson.title}</h1>
      <div class="lesson-sub">${mod.desc}</div>
      <div class="tabs">
        <div class="tab active" onclick="switchTab('theory',this)"><i class="fas fa-book-open"></i> Теория</div>
        <div class="tab" onclick="switchTab('practice',this)"><i class="fas fa-code"></i> Практика ${done?'<span class="badge"><i class="fas fa-check" style="color:#2f7d32"></i></span>':''}</div>
      </div>
      <div class="panel active" id="panel-theory">
        <div class="theory">${lesson.theory}</div>
        <div class="lesson-nav">
          <button onclick="prevLesson()" ${!adj.prev?'disabled':''}><i class="fas fa-arrow-left"></i> Предыдущий</button>
          <button onclick="switchTab('practice',document.querySelector('.tab:last-child'))" style="background:var(--fcc-green);color:#fff;border:none">Перейти к практике <i class="fas fa-arrow-right"></i></button>
          <button onclick="nextLesson()" ${!adj.next?'disabled':''}>Следующий <i class="fas fa-arrow-right"></i></button>
        </div>
      </div>
      <div class="panel" id="panel-practice">
        <div class="ide">
          <div class="ide-left">
            <div class="challenge-card">
              <h4><i class="fas fa-flag-checkered"></i> Задание</h4>
              <p style="font-size:14px;margin-bottom:12px;color:var(--fcc-gray)">Напишите код, который выполняет все условия:</p>
              <ul class="task-list" id="taskList">
                ${lesson.tasks.map((t,i)=>`<li id="task-${i}">${t.label}</li>`).join('')}
              </ul>
            </div>
            <div class="challenge-card">
              <h4><i class="fas fa-lightbulb"></i> Подсказки</h4>
              <div class="ide-actions" style="margin-bottom:8px">
                <button class="btn btn-hint" onclick="toggleHint()"><i class="fas fa-key"></i> Подсказка</button>
                <button class="btn btn-sol" onclick="toggleSolution()"><i class="fas fa-eye"></i> Решение</button>
              </div>
              <div class="hint-box" id="hintBox">${lesson.hint}</div>
              <div class="solution-box" id="solBox">${escapeHtml(lesson.solution)}</div>
            </div>
          </div>
          <div class="ide-right">
            <div class="editor-wrap">
              <div class="editor-toolbar">
                <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
                <span class="fname">main.py</span>
              </div>
              <textarea id="codeEditor">${escapeHtml(lesson.starter)}</textarea>
            </div>
            <div class="ide-actions">
              <button class="btn btn-run" onclick="runCode()"><i class="fas fa-play"></i> Запустить</button>
              <button class="btn btn-test" onclick="runTests()"><i class="fas fa-vial"></i> Проверить</button>
              <button class="btn btn-sol" onclick="resetCode()"><i class="fas fa-undo"></i> Сбросить</button>
            </div>
            <div class="console-wrap">
              <div class="console-head">
                <span><i class="fas fa-terminal"></i> Консоль</span>
                <button class="clear-btn" onclick="clearConsole()">Очистить</button>
              </div>
              <div class="console-body" id="consoleBody"><span class="info"># Нажмите "Запустить" для выполнения кода\n# Нажмите "Проверить" для тестирования задания</span></div>
            </div>
          </div>
        </div>
        <div class="lesson-nav">
          <button onclick="prevLesson()" ${!adj.prev?'disabled':''}><i class="fas fa-arrow-left"></i> Предыдущий</button>

      </div>
    </div>
  `;
  // Init CodeMirror
  setTimeout(initEditor, 50);

function initEditor(){
  const ta = document.getElementById('codeEditor');
  if(!ta) return;
  editor = CodeMirror.fromTextArea(ta, {
    mode: "python",
    theme: document.body.dataset.theme==='dark'?'dracula':'eclipse',
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    autoCloseBrackets: true,
    matchBrackets: true,
    styleActiveLine: true,
    lineWrapping: false
  });
}

function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='practice' && editor) setTimeout(()=>editor.refresh(),50);
}

function toggleHint(){ document.getElementById('hintBox').classList.toggle('show'); }
function toggleSolution(){ document.getElementById('solBox').classList.toggle('show'); }

function clearConsole(){ document.getElementById('consoleBody').innerHTML='<span class="info"># Консоль очищена</span>'; }

function resetCode(){
  if(editor && currentLessonCtx){
    editor.setValue(currentLessonCtx.lesson.starter);
    clearConsole();
  }
}

function consoleAppend(html, cls='out'){
  const c = document.getElementById('consoleBody');
  if(!c) return;
  // Remove initial info message
  if(c.querySelector('.info') && c.children.length===1 && c.textContent.includes('Нажмите')) c.innerHTML='';
  const line = document.createElement('div');
  line.className = cls;
  line.innerHTML = html;
  c.appendChild(line);
  c.scrollTop = c.scrollHeight;
}

async function runCode(){
  if(!pyodideReady){ showToast("Python ещё загружается...","error"); return; }
  const code = editor.getValue();
  consoleAppend('<span class="info">▶ Запуск...</span>','info');
  const r = await runUserCode(code);
  if(r.output) consoleAppend(escapeHtml(r.output),'out');
  if(r.error) consoleAppend('<span class="err">⚠ '+escapeHtml(r.error)+'</span>','err');
  if(!r.output && !r.error) consoleAppend('<span class="info">(нет вывода)</span>','info');
}

async function runTests(){
  if(!pyodideReady){ showToast("Python ещё загружается...","error"); return; }
  const code = editor.getValue();
  const lesson = currentLessonCtx.lesson;
  // Precompute outputs
  await precomputeTaskOutputs(code, lesson);
  // Reset visual
  lesson.tasks.forEach((t,i)=>{
    const el = document.getElementById('task-'+i);
    if(el){ el.classList.remove('pass','fail'); }
  });
  // Run each task test
  let allPass = true;
  for(let i=0;i<lesson.tasks.length;i++){
    const t = lesson.tasks[i];
    let pass = false;
    try{
      pass = t.test();
    }catch(e){
      pass = false;
    }
    const el = document.getElementById('task-'+i);
    if(el){
      el.classList.add(pass?'pass':'fail');
    }
    if(!pass) allPass = false;
  }
  if(allPass){
    markDone(lesson.id);
    showToast("🎉 Все тесты пройдены! Урок засчитан.","success");
    renderSidebar();
    // Update tab badge
    const tab = document.querySelector('.tab:last-child');
    if(tab && !tab.querySelector('.badge')){
      tab.innerHTML += ' <span class="badge"><i class="fas fa-check" style="color:#2f7d32"></i></span>';
    }
    // Show next button
    setTimeout(()=>{
      if(confirm("Урок пройден! Перейти к следующему?")) nextLesson();
    },300);
  }else{
    showToast("Некоторые тесты не пройдены. Проверьте код.","error");
  }
}

function prevLesson(){
  if(!state.current) return;
  const adj = getAdjacent(state.current);
  if(adj.prev) openLesson(adj.prev.lesson.id);
}
function nextLesson(){
  if(!state.current) return;
  const adj = getAdjacent(state.current);
  if(adj.next) openLesson(adj.next.lesson.id);
  else {
    // Last lesson — go to dashboard
    goDashboard();
    showToast("🎉 Вы прошли последний урок курса!","success");
  }
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function goDashboard(){
  state.current = null;
  saveState();
  renderSidebar();
  renderDashboard();
}
function goCurriculum(){
  // Open sidebar on mobile
  document.getElementById('sidebar').classList.add('open');
  // Open first module
  const first = document.querySelector('.module-head');
  if(first && !first.parentElement.classList.contains('open')) toggleModule(first);
}
function goProgress(){
  goDashboard();
}

/* ============================================================
   UTILITIES
   ============================================================ */
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg, type='success'){
  const t = document.getElementById('toast');
  t.className = 'toast '+type;
  document.getElementById('toastMsg').textContent = msg;
  t.querySelector('i').className = 'fas '+(type==='success'?'fa-check-circle':'fa-exclamation-circle');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}

/* ============================================================
   THEME
   ============================================================ */
function toggleTheme(){
  const cur = document.body.dataset.theme;
  const next = cur==='dark'?'light':'dark';
  document.body.dataset.theme = next;
  state.theme = next;
  saveState();
  document.querySelector('#themeBtn i').className = next==='dark'?'fas fa-sun':'fas fa-moon';
  if(editor){
    editor.setOption('theme', next==='dark'?'dracula':'eclipse');
  }
}

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener('DOMContentLoaded', async ()=>{
  loadState();
  document.body.dataset.theme = state.theme||'light';
  document.querySelector('#themeBtn i').className = state.theme==='dark'?'fas fa-sun':'fas fa-moon';
  updateProgress();
  renderSidebar();
  renderDashboard();
  
  // Menu toggle (mobile)
  document.getElementById('menuBtn').onclick = ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  };
  document.getElementById('themeBtn').onclick = toggleTheme;
  document.getElementById('sbSearch').oninput = (e)=>renderSidebar(e.target.value);
  
  // Load Pyodide
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
  script.onload = async ()=>{
    await initPyodide();
    if(pyodideReady) setupStdoutCapture();
  };
  document.head.appendChild(script);
});
</script>
