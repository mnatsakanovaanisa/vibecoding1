<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PyCamp — Интерактивный курс Python</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a23;
    --bg-2: #1b1b32;
    --bg-3: #2a2a40;
    --text: #dfdfe2;
    --text-dim: #a0a0b0;
    --accent: #f1be32;
    --accent-2: #acacac;
    --success: #3bd16f;
    --error: #eb5757;
    --border: #3b3b4f;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; }
  body { display: flex; flex-direction: column; }
  header {
    background: var(--bg-2);
    border-bottom: 2px solid var(--accent);
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .logo { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  .logo span { color: var(--text); }
  .header-info { font-size: 13px; color: var(--text-dim); }
  .progress-bar { width: 200px; height: 8px; background: var(--bg-3); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .3s; }
  .container { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 280px; background: var(--bg-2); border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0;
  }
  .sidebar h3 { padding: 12px 16px; color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
  .section-title { padding: 10px 16px; font-size: 12px; color: var(--accent); text-transform: uppercase; margin-top: 8px; letter-spacing: .5px; }
  .lesson-item {
    padding: 8px 16px 8px 24px; cursor: pointer; font-size: 14px;
    border-left: 3px solid transparent; display: flex; align-items: center; gap: 8px;
    transition: background .15s;
  }
  .lesson-item:hover { background: var(--bg-3); }
  .lesson-item.active { background: var(--bg-3); border-left-color: var(--accent); color: var(--accent); }
  .lesson-item.done::before { content: "✓"; color: var(--success); font-weight: bold; }
  .lesson-item:not(.done)::before { content: "○"; color: var(--text-dim); }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .lesson-view { flex: 1; overflow-y: auto; padding: 30px 40px; max-width: 100%; }
  .lesson-view h1 { color: var(--accent); margin-bottom: 16px; font-size: 26px; }
  .lesson-view h2 { color: var(--accent); margin: 20px 0 10px; font-size: 18px; }
  .lesson-view p { margin-bottom: 12px; line-height: 1.6; }
  .lesson-view code { background: var(--bg-3); padding: 2px 6px; border-radius: 3px; font-family: "Fira Code", Consolas, monospace; color: #f1be32; font-size: 14px; }
  .lesson-view pre { background: var(--bg-2); padding: 14px; border-radius: 6px; margin: 12px 0; overflow-x: auto; border-left: 3px solid var(--accent); }
  .lesson-view pre code { background: none; padding: 0; color: var(--text); }
  .lesson-view ul, .lesson-view ol { margin: 10px 0 12px 24px; line-height: 1.7; }
  .task-box { background: var(--bg-2); border: 1px solid var(--accent); border-radius: 6px; padding: 16px; margin: 20px 0; }
  .task-box h3 { color: var(--accent); margin-bottom: 10px; font-size: 16px; }
  .editor-area { flex-shrink: 0; border-top: 2px solid var(--border); display: flex; flex-direction: column; height: 45vh; min-height: 280px; }
  .editor-toolbar { display: flex; gap: 10px; padding: 8px 16px; background: var(--bg-2); border-bottom: 1px solid var(--border); align-items: center; }
  .btn {
    background: var(--accent); color: var(--bg); border: none; padding: 8px 16px;
    font-weight: 600; cursor: pointer; border-radius: 4px; font-size: 14px;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn.secondary { background: var(--bg-3); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .editor-wrap { flex: 1; position: relative; overflow: hidden; }
  .CodeMirror { height: 100% !important; font-size: 14px; font-family: "Fira Code", Consolas, monospace; }
  .console { height: 160px; background: #000; color: #ddd; padding: 10px 14px; overflow-y: auto; font-family: "Fira Code", Consolas, monospace; font-size: 13px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .console-line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-word; }
  .console-line.error { color: var(--error); }
  .console-line.success { color: var(--success); }
  .console-line.info { color: var(--accent); }
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(10,10,35,.95); z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--accent); font-size: 18px;
  }
  .spinner { width: 50px; height: 50px; border: 4px solid var(--bg-3); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-status { color: var(--text-dim); font-size: 14px; margin-top: 10px; }
  .nav-buttons { display: flex; justify-content: space-between; margin-top: 24px; }
  @media (max-width: 768px) {
    .sidebar { width: 220px; }
    .lesson-view { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Py<span>Camp</span></div>
    <div class="header-info">Интерактивный курс Python · <span id="progress-text">0 / 0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="header-info">Python в браузере через Pyodide</div>
</header>

<div class="container">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="lesson-view" id="lesson-view"></div>
    <div class="editor-area">
      <div class="editor-toolbar">
        <button class="btn" id="btn-run">▶ Запустить</button>
        <button class="btn" id="btn-check">✓ Проверить задание</button>
        <button class="btn secondary" id="btn-reset">↺ Сбросить</button>
        <button class="btn secondary" id="btn-solution">💡 Показать решение</button>
        <span style="margin-left:auto; color: var(--text-dim); font-size: 13px;" id="status-text"></span>
      </div>
      <div class="editor-wrap"><textarea id="editor"></textarea></div>
    </div>
    <div class="console" id="console"></div>
  </main>
</div>

<div class="loading-overlay" id="loader">
  <div class="spinner"></div>
  <div>Загружаем Python в браузер...</div>
  <div class="loader-status" id="loader-status">Инициализация Pyodide</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

<script>
// ============================================================
// КУРС: уроки, теория, задания, тесты
// ============================================================
const LESSONS = [
  // ================= РАЗДЕЛ 1: ОСНОВЫ =================
  { section: "Основы Python", id: 1, title: "Привет, мир!", theory: `
<h1>Урок 1. Привет, мир!</h1>
<p>Традиционно изучение любого языка программирования начинается с программы, которая выводит на экран фразу <code>"Hello, World!"</code>.</p>
<p>В Python для вывода информации используется функция <code>print()</code>:</p>
<pre><code>print("Hello, World!")</code></pre>
<p>Текст, заключённый в кавычки, называется <b>строкой</b> (string). Кавычки могут быть одинарными <code>'</code> или двойными <code>"</code> — Python воспринимает их одинаково.</p>
<div class="task-box">
  <h3> Задание</h3>
  <p>Выведите на экран фразу <code>Hello, World!</code> (именно в таком виде, с восклицательным знаком).</p>
</div>`,
    starter: `# Напишите ваш код здесь\nprint(...)`,
    solution: `print("Hello, World!")`,
    tests: [
      (out, vars) => out.trim() === "Hello, World!" || out.includes("Hello, World!")
    ]
  },

  { section: "Основы Python", id: 2, title: "Переменные", theory: `
<h1>Урок 2. Переменные</h1>
<p><b>Переменная</b> — это именованная ячейка памяти, в которой хранится значение. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
<pre><code>name = "Алиса"
age = 25
print(name)
print(age)</code></pre>
<p>Правила именования переменных:</p>
<ul>
  <li>Могут содержать буквы, цифры и символ <code>_</code></li>
  <li>Не могут начинаться с цифры</li>
  <li>Регистр имеет значение: <code>Age</code> и <code>age</code> — разные переменные</li>
</ul>
<div class="task-box">
  <h3> Задание</h3>
  <p>Создайте переменную <code>x</code> со значением <code>10</code> и переменную <code>y</code> со значением <code>20</code>. Выведите их сумму.</p>
</div>`,
    starter: `# Создайте переменные x и y\n# Выведите их сумму\n`,
    solution: `x = 10\ny = 20\nprint(x + y)`,
    tests: [
      (out) => out.trim() === "30"
    ]
  },

  { section: "Основы Python", id: 3, title: "Типы данных", theory: `
<h1>Урок 3. Типы данных</h1>
<p>В Python есть несколько основных типов данных:</p>
<ul>
  <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code></li>
  <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
  <li><code>str</code> — строки: <code>"привет"</code></li>
  <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
  <li><code>NoneType</code> — специальное значение <code>None</code> (отсутствие значения)</li>
</ul>
<p>Функция <code>type()</code> позволяет узнать тип переменной:</p>
<pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;</code></pre>
<div class="task-box">
  <h3> Задание</h3>
  <p>Создайте переменные: <code>a = 5</code>, <code>b = 3.14</code>, <code>c = "Python"</code>. Выведите тип каждой из них (в отдельных строках).</p>
</div>`,
    starter: `a = 5\nb = 3.14\nc = "Python"\n# Выведите тип каждой переменной\n`,
    solution: `a = 5\nb = 3.14\nc = "Python"\nprint(type(a))\nprint(type(b))\nprint(type(c))`,
    tests: [
      (out) => out.includes("<class 'int'>") && out.includes("<class 'float'>") && out.includes("<class 'str'>")
    ]
  },

  { section: "Основы Python", id: 4, title: "Числа и арифметика", theory: `
<h1>Урок 4. Числа и арифметика</h1>
<p>Python поддерживает все стандартные арифметические операции:</p>
<ul>
  <li><code>+</code> — сложение</li>
  <li><code>-</code> — вычитание</li>
  <li><code>*</code> — умножение</li>
  <li><code>/</code> — деление (всегда возвращает float)</li>
  <li><code>//</code> — целочисленное деление</li>
  <li><code>%</code> — остаток от деления</li>
  <li><code>**</code> — возведение в степень</li>
</ul>
<pre><code>print(10 / 3)   # 3.3333...\nprint(10 // 3)  # 3\nprint(10 % 3)   # 1\nprint(2 ** 10)  # 1024</code></pre>
<div class="task-box">
  <h3>📝 Задание</h3>
  <p>Вычислите и выведите: площадь круга радиуса 5 (по формуле π·r², используйте <code>3.14159</code> вместо π).</p>
</div>`,
    starter: `r = 5\npi = 3.14159\n# Вычислите площадь и выведите\n`,
    solution: `r = 5\npi = 3.14159\narea = pi * r ** 2\nprint(area)`,
    tests: [
      (out) => Math.abs(parseFloat(out) - 78.53975) < 0.001
    ]
  },

  { section: "Основы Python", id: 5, title: "Строки", theory: `
<h1>Урок 5. Строки</h1>
<p>Строка — это последовательность символов. К символам можно обращаться по индексу (начинается с 0):</p>
<pre><code>s = "Python"
print(s[0])   # P
print(s[-1])  # n (последний символ)
print(len(s)) # 6 (длина строки)</code></pre>
<p>Строки можно объединять (конкатенация) с помощью <code>+</code>:</p>
<pre><code>first = "Hello"
second = "World"
print(first + " " + second)</code></pre>
<div class="task-box">
  <h3>📝 Задание</h3>
  <p>Даны строки <code>first = "Py"</code> и <code>second = "thon"</code>. Выведите их объединение и длину полученной строки (в двух отдельных строках).</p>
</div>`,
    starter: `first = "Py"\nsecond = "thon"\n# Выведите объединение и его длину\n`,
    solution: `first = "Py"\nsecond = "thon"\nresult = first + second\nprint(result)\nprint(len(result))`,
    tests: [
      (out) => out.includes("Python") && out.includes("6")
    ]
  },

  { section: "Основы Python", id: 6, title: "Ввод данных", theory: `
<h1>Урок 6. Ввод данных</h1>
<p>Функция <code>input()</code> позволяет получить данные от пользователя. Она всегда возвращает строку:</p>
<pre><code>name = input("Как вас зовут? ")
print("Привет, " + name)</code></pre>
<p>Если нужно число, используйте преобразование типа:</p>
<pre><code>age = int(input("Ваш возраст: "))
print("Через год вам будет", age + 1)</code></pre>
<p><b>Внимание:</b> в нашей среде <code>input()</code> возвращает предопределённые значения — для тестов они задаются автоматически.</p>
<div class="task-box">
  <h3>📝 Задание</h3>
  <p>Напишите программу, которая запрашивает число (используйте <code>input()</code>), возводит его в квадрат и выводит результат. Для тестирования мы подадим на вход число <code>7</code>.</p>
</div>`,
    starter: `# Запросите число и выведите его квадрат\n# Для теста используйте input() и преобразование в int\n`,
    solution: `n = int(input())\nprint(n ** 2)`,
    tests: [
      async (out, vars, runWithInput) => {
        const result = await runWithInput("7");
        return result.trim() === "49";
      }
    ]
  },

  { section: "Основы Python", id: 7, title: "Форматирование строк", theory: `
<h1>Урок 7. Форматирование строк</h1>
<p>Самый современный способ — <b>f-строки</b> (Python 3.6+). Перед строкой ставится буква <code>f</code>, а внутри <code>{}</code> можно подставлять выражения:</p>
<pre><code>name = "Мир"
age = 5
print(f"Привет, {name}! Тебе {age} лет.")
print(f"Через 10 лет: {age + 10}")</code></pre>
<p>Старые способы: оператор <code>%</code> и метод <code>.format()</code>:</p>
<pre><code>print("Привет, %s!" % name)
print("Привет, {}!".format(name))</code></pre>
<div class="task-box">
  <h3>📝 Задание</h3>
  <p>Даны переменные <code>item = "яблоки"</code> и <code>count = 5</code>. С помощью f-строки выведите: <code>Купил 5 apples</code> (замените "apples" на значение переменной item).</p>
</div>`,
    starter: `item = "яблоки"\ncount = 5\n# Используйте f-строку\n`,
    solution: `item = "яблоки"\ncount = 5\nprint(f"Купил {count} {item}")`,
    tests: [
      (out) => out.trim() === "Купил 5 яблоки"
    ]
  },

  // ================= РАЗДЕЛ 2: УПРАВЛЯЮЩИЕ КОНСТРУКЦИИ =================
  { section: "Управляющие конструкции", id: 8, title: "Условия if/elif/else", theory: `
<h1>Урок 8. Условия if/elif/else</h1>
<p>Условный оператор позволяет выполнять разный код в зависимости от условия:</p>
<pre><code>age = 18
if age >= 18:
    print("Совершеннолетний")
elif age >= 14:
    print("Подросток")
else:
    print("Ребёнок")</code></pre>
<p><b>Важно:</b> в Python блоки кода выделяются <b>отступами</b> (обычно 4 пробела). Это не просто стиль — это синтаксис!</p>
<div class="task-box">
  <h3>📝 Задание</h3>
  <p>Напишите программу, которая читает число <code>n</code> из <code>input()</code> и выводит: <code>positive</code>, <code>negative</code> или <code>zero</code>.</p>
</div>`,
    starter: `n = int(input())\n# Напишите условия\n`,
    solution: `n = int(input())\nif n > 0:\n    print("positive")\nelif n < 0:\n    print("negative")\nelse:\n    print("zero")`,
    tests: [
      async (o, v, run) => (await run("5")).trim() === "positive" &&
                           (await run("-3")).trim() === "negative" &&
                           (await run("0")).trim() === "zero"
    ]
  },

  { section: "Управляющие конструкции", id: 9, title: "Логические операторы", theory: `
<h1>Урок 9. Логические операторы</h1>
<p>Для комбинации условий используются операторы:</p>
<ul>
  <li><code>and</code> — И (оба условия истинны)</li>
  <li><code>or</code> — ИЛИ (хотя бы одно истинно)</li>
  <li><code>not</code> — отрицание</li>
</ul>
<pre><code>x = 15
if x > 10 and x < 20:
    print("В диапазоне")

if x == 0 or x == 1:
    print("0 или 1")

if not (x < 0):
    print("Не отрицательное")</code></pre>
<p>Операторы сравнения: <code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>.</p>
<div class="task-box">
  <h3>📝 Задание</h3>
  <p>Прочитайте число <code>n</code>. Если оно делится и на 3, и на 5 — выведите <code>FizzBuzz</code>. Только на 3 — <code>Fizz</code>. Только на 5 — <code>Buzz</code>. Иначе — само число.</p>
</div>`,
    starter: `n = int(input())\n# Ваш код\n`,
    solution: `n = int(input())\nif n % 3 == 0 and n % 5 == 0:\n    print("FizzBuzz")\nelif n % 3 == 0:\n    print("Fizz")\nelif n % 5 == 0:\n    print("Buzz")\nelse:\n    print(n)`,
    tests: [
      async (o, v, run) => (await run("15")).trim() === "FizzBuzz" &&
                           (await run("9")).trim() === "Fizz" &&
                           (await run("10")).trim() === "Buzz" &&
                           (await run("7")).trim() === "7"
    ]
  },

  { section: "Управляющие конструкции", id: 10, title: "Цикл for", theory: `
<h1>Урок 10. Цикл for</h1>
<p>Цикл <code>for</code> перебирает элементы последовательности:</p>
<pre><code>for i in range(5):
    print(i)  # 0, 1, 2, 3, 4

for ch in "Python":
    print(ch)</code></pre>
<p>Функция <code>range()</code> генерирует последовательность чисел:</p>
<ul>
  <li><code>range(n)</code> — от 0 до n-1</li>
  <li><code>range(a, b)</code> — от a до b-1</li>
  <li><code>range(a, b, step)</code> — от a до b-1 с шагом step</li>
</ul>
<div class="task-box">
  <h3>📝 Задание</h3>
  <p>Выведите все чётные числа от 2 до 20 включительно, каждое на новой строке.</p>
</div>`,
    starter: `# Используйте for и range\n`,
    solution: `for i in range(2, 21, 2):\n    print(i)`,
    tests: [
      (out) => {
        const expected = [];

// ============================================================
// СОСТОЯНИЕ ПРИЛОЖЕНИЯ
// ============================================================
let pyodide = null;
let editor = null;
let currentLessonId = 1;
let completedLessons = JSON.parse(localStorage.getItem('pycamp_completed') || '[]');

// ============================================================
// ИНИЦИАЛИЗАЦИЯ PYODIDE
// ============================================================
async function initPyodide() {
  const status = document.getElementById('loader-status');
  try {
    status.textContent = "Загрузка Pyodide runtime...";
    pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
    });
    status.textContent = "Настройка окружения...";
    await pyodide.runPythonAsync(`
import sys
import io
sys.version
    `);
    document.getElementById('loader').style.display = 'none';
    initApp();
  } catch (e) {
    status.textContent = "Ошибка загрузки: " + e.message;
    console.error(e);
  }
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ UI
// ============================================================
function initApp() {
  editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
    mode: 'python',
    theme: 'dracula',
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    matchBrackets: true,
    autoCloseBrackets: true
  });
  editor.setSize('100%', '100%');

  renderSidebar();
  loadLesson(currentLessonId);
  updateProgress();

  document.getElementById('btn-run').onclick = runCode;
  document.getElementById('btn-check').onclick = checkSolution;
  document.getElementById('btn-reset').onclick = resetCode;
  document.getElementById('btn-solution').onclick = showSolution;
}

// ============================================================
// БОКОВАЯ ПАНЕЛЬ
// ============================================================
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<h3>Программа курса</h3>';
  let currentSection = '';
  LESSONS.forEach(lesson => {
    if (lesson.section !== currentSection) {
      currentSection = lesson.section;
      const sec = document.createElement('div');
      sec.className = 'section-title';
      sec.textContent = currentSection;
      sb.appendChild(sec);
    }
    const item = document.createElement('div');
    item.className = 'lesson-item';
    if (completedLessons.includes(lesson.id)) item.classList.add('done');
    if (lesson.id === currentLessonId) item.classList.add('active');
    item.textContent = `${lesson.id}. ${lesson.title}`;
    item.onclick = () => loadLesson(lesson.id);
    sb.appendChild(item);
  });
}

// ============================================================
// ЗАГРУЗКА УРОКА
// ============================================================
function loadLesson(id) {
  const lesson = LESSONS.find(l => l.id === id);
  if (!lesson) return;
  currentLessonId = id;
  document.getElementById('lesson-view').innerHTML = lesson.theory;
  const savedCode = localStorage.getItem(`pycamp_code_${id}`);
  editor.setValue(savedCode || lesson.starter.replace(/\\n/g, '\n'));
  clearConsole();
  document.getElementById('status-text').textContent = '';
  renderSidebar();
  document.getElementById('lesson-view').scrollTop = 0;
}

// ============================================================
// ВЫПОЛНЕНИЕ КОДА
// ============================================================
async function runPython(code, inputValues = []) {
  // Захват stdout
  await pyodide.runPythonAsync(`
import sys, io
class OutputCatcher:
    def __init__(self):
        self.data = []
        self._inputs = ${JSON.stringify(inputValues)}
        self._input_idx = 0
    def write(self, s):
        self.data.append(s)
    def getvalue(self):
        return "".join(self.data)
    def readline(self):
        if self._input_idx < len(self._inputs):
            val = self._inputs[self._input_idx]
            self._input_idx += 1
            return str(val) + "\\n"
        return ""
_catcher = OutputCatcher()
sys.stdout = _catcher
sys.stdin = _catcher
  `);
  let error = null;
  try {
    await pyodide.runPythonAsync(code);
  } catch (e) {
    error = e.message;
  }
  const output = await pyodide.runPythonAsync(`
sys.stdout = sys.__stdout__
sys.stdin = sys.__stdin__
_catcher.getvalue()
  `);
  // Собираем переменные
  const vars = {};
  try {
    const pyVars = await pyodide.runPythonAsync(`
[g for g in globals() if not g.startswith('_')]
    `);
    for (const name of pyVars.toJs()) {
      try {
        const val = pyodide.globals.get(name);
        if (typeof val !== 'function' && typeof val?.toJs !== 'function') {
          vars[name] = val;
        }
      } catch(e) {}
    }
  } catch(e) {}
  return { output, error, vars };
}

async function runCode() {
  clearConsole();
  const code = editor.getValue();
  logConsole("▶ Запуск...", "info");
  const { output, error } = await runPython(code);
  if (error) {
    logConsole("✗ Ошибка:", "error");
    logConsole(error, "error");
  } else {
    if (output) logConsole(output);
    else logConsole("(программа завершилась без вывода)", "info");
  }
}

// Запуск с входными данными (для тестов)
async function runWithInput(code, inputs) {
  const { output, error } = await runPython(code, inputs);
  if (error) throw new Error(error);
  return output;
}

// ============================================================
// ПРОВЕРКА ЗАДАНИЯ
// ============================================================
async function checkSolution() {
  clearConsole();
  const lesson = LESSONS.find(l => l.id === currentLessonId);
  const code = editor.getValue();
  logConsole("✓ Проверка решения...", "info");

  // Запустим код пользователя
  const { output, error, vars } = await runPython(code);
  if (error) {
    logConsole("✗ Ошибка выполнения:", "error");
    logConsole(error, "error");
    return;
  }

  // Функция-помощник для тестов
  const runWithInputHelper = async (input) => {
    return await runWithInput(code, [input]);
  };

  let passed = 0;
  let failed = 0;
  for (let i = 0; i < lesson.tests.length; i++) {
    try {
      const result = await lesson.tests[i](output, vars, runWithInputHelper);
      if (result) {
        passed++;
        logConsole(`✓ Тест ${i+1} пройден`, "success");
      } else {
        failed++;
        logConsole(`✗ Тест ${i+1} не пройден`, "error");
      }
    } catch (e) {
      failed++;
      logConsole(`✗ Тест ${i+1}: ${e.message}`, "error");
    }
  }

  if (failed === 0) {
    logConsole(`\n🎉 Отлично! Все ${passed} тестов пройдены!`, "success");
    if (!completedLessons.includes(lesson.id)) {
      completedLessons.push(lesson.id);
      localStorage.setItem('pycamp_completed', JSON.stringify(completedLessons));
      updateProgress();
      renderSidebar();
    }
    document.getElementById('status-text').textContent = '✓ Задание выполнено!';
  } else {
    logConsole(`\nПройдено ${passed} из ${passed+failed} тестов. Попробуйте ещё раз!`, "error");
    document.getElementById('status-text').textContent = '';
  }
}

// ============================================================
// УТИЛИТЫ
// ============================================================
function resetCode() {
  const lesson = LESSONS.find(l => l.id === currentLessonId);
  editor.setValue(lesson.starter.replace(/\\n/g, '\n'));
  localStorage.removeItem(`pycamp_code_${currentLessonId}`);
  clearConsole();
}

function showSolution() {
  const lesson = LESSONS.find(l => l.id === currentLessonId);
  if (confirm("Показать решение? Попробуйте сначала сами!")) {
    editor.setValue(lesson.solution);
  }
}

function clearConsole() {
  document.getElementById('console').innerHTML = '';
}

function logConsole(text, type = '') {
  const c = document.getElementById('console');
  const line = document.createElement('div');
  line.className = 'console-line' + (type ? ' ' + type : '');
  line.textContent = text;
  c.appendChild(line);
  c.scrollTop = c.scrollHeight;
}

function updateProgress() {
  const total = LESSONS.length;
  const done = completedLessons.length;
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = `${(done/total)*100}%`;
}

// Автосохранение кода
setInterval(() => {
  if (editor) {
    localStorage.setItem(`pycamp_code_${currentLessonId}`, editor.getValue());
  }
}, 2000);

// Запуск
initPyodide();
</script>
